<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Install Luna-Inc</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #1e3a8a, #020617);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

/* CARD */
.container {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(15px);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  width: 90%;
  max-width: 350px;
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
  animation: fadeUp .6s ease;
}

h1 {
  margin-bottom: 10px;
  font-size: 24px;
}

p {
  color: #ccc;
  font-size: 14px;
  margin-bottom: 20px;
}

/* BUTTON */
.btn {
  display: block; /* Agar tag <a> bisa mengisi lebar penuh */
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  font-size: 15px;
  margin-top: 15px;
  cursor: pointer;
  transition: .3s;
  text-decoration: none; /* Menghilangkan garis bawah pada link */
  font-family: 'Poppins', sans-serif;
}

.install {
  background: linear-gradient(45deg, #3b82f6, #6366f1);
  color: white;
}

.install:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
}

.apk {
  background: #111827;
  border: 1px solid #333;
  color: #aaa;
}

.apk:hover {
  background: #1f2937;
  color: white;
}

/* ICON */
.icon {
  width: 80px;
  height: 80px;
  margin-bottom: 15px;
  border-radius: 20px;
  object-fit: cover;
}

/* BADGE */
.badge {
  display: inline-block;
  background: #22c55e;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 10px;
}

/* ANIM */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">

  <img src="brd.png" class="icon" alt="Icon Luna-Inc">

  <div class="badge">🔥 Official App</div>

  <h1>Luna-Inc Game</h1>
  <p>Mainkan game langsung dari layar utama HP kamu tanpa ribet 🚀</p>

  <button id="installBtn" class="btn install" style="display: none;">
    📲 Install App
  </button>

  <a href="Luna-Game.apk" download class="btn apk">
    📦 Download APK
  </a>

</div>

<script>
// AUTO REDIRECT kalau sudah terinstall (Mode PWA Standalone)
if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
  window.location.href = "index.html";
}

let deferredPrompt;

// DETECT PWA SUPPORT
window.addEventListener('beforeinstallprompt', (e) => {
  // Mencegah prompt bawaan browser muncul secara otomatis
  e.preventDefault();
  // Menyimpan event untuk dipicu nanti
  deferredPrompt = e;
  
  // Menampilkan tombol install buatan kita
  document.getElementById("installBtn").style.display = "block";
});

// INSTALL CLICK
document.getElementById("installBtn").addEventListener("click", async () => {
  if (deferredPrompt) {
    // Menampilkan prompt install PWA
    deferredPrompt.prompt();
    
    // Menunggu pilihan user (Install atau Batal)
    const { outcome } = await deferredPrompt.userChoice;
    console.log(`User response to the install prompt: ${outcome}`);
    
    // Reset variabel
    deferredPrompt = null;
  }
});
</script>

</body>
</html>
